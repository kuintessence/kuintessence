name: Preview Cleanup

on:
  pull_request_target:
    types: [closed, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Ineligible PR whose preview should be removed"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  deployments: write
  packages: write

jobs:
  cleanup:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       (github.event.action == 'closed' ||
        github.event.action == 'converted_to_draft' ||
        (github.event.action == 'labeled' && github.event.label.name == 'preview-paused') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'TRUST_PR_CREATOR')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: kq-preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      # Only base/default-branch orchestration; never checkout the PR head here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify the preview should still be removed
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            await require("./deploy/preview/gate.cjs").cleanupGate({github, context, core});
      - uses: azure/setup-kubectl@v4
        if: steps.check.outputs.allowed == 'true'
        with:
          version: v1.32.3
      - uses: azure/setup-helm@v4
        if: steps.check.outputs.allowed == 'true'
        with:
          version: v3.17.3
      - name: Remove only the owned PR release and data in preview
        id: namespace
        if: steps.check.outputs.allowed == 'true'
        env:
          PREVIEW_PR: ${{ steps.check.outputs.pr }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: bash deploy/preview/remote.sh cleanup
      - name: Remove this PR's dev image versions
        if: steps.namespace.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PREVIEW_PR: ${{ steps.check.outputs.pr }}
        with:
          script: |
            await require("./deploy/preview/ghcr-cleanup.cjs").cleanupImages(
              {github, context, core}, {pr: process.env.PREVIEW_PR},
            );
      - name: Update the PR and deployments
        if: always() && steps.namespace.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PREVIEW_PR: ${{ steps.check.outputs.pr }}
        with:
          script: |
            await require("./deploy/preview/notice.cjs").notice(
              {github, context, core}, "inactive", process.env.PREVIEW_PR,
            );
