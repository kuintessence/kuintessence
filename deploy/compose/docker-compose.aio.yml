# All-in-one demo bring-up.
#
# Usage:
#   bun run compose -- aio up --build --attach
#
# After startup:
#   Web SPA + Server API   http://localhost:8080
#   RustFS API           http://localhost:9000
#   RustFS console       http://localhost:9001  (rustfsadmin / rustfsadmin)
#   App login           admin@example.com, role super_admin, no password
#
# Inside the container Postgres + Redis + RustFS + Server + Registry + Web/nginx
# all run together, supervised by deploy/aio/entrypoint.sh. Persistent data lives
# in the kq-aio-data volume (drop with `docker compose --project-directory . -f deploy/compose/docker-compose.aio.yml down -v`).
#
# Local test/demo credentials only. Production deployment uses the Helm chart.

services:
  kq:
    build:
      context: .
      dockerfile: deploy/aio/Dockerfile
      args:
        VITE_PREVIEW_LOGIN: "true"
    image: kuintessence-aio:latest
    container_name: kq-aio
    ports:
      - "127.0.0.1:8080:80"      # Web SPA + Server API (via nginx)
      - "127.0.0.1:9000:9000"    # RustFS API (NetDrive presigned URLs)
      - "127.0.0.1:9001:9001"    # RustFS console
    volumes:
      - kq-aio-data:/data
    environment:
      NODE_ENV: development
      AUTHZ_MODE: "off"
      SSO_BOOTSTRAP_ENABLED: "false"
      WEB_BASE_URL: http://localhost:8080/
      # Shared by both Server and Registry; use the epoch returned by pause.
      SPACK_MATERIAL_EPOCH: ${SPACK_MATERIAL_EPOCH:-}
      SPACK_RECIPE_STORE_DIR: /data/registry/recipes
      SPACK_MATERIAL_STORE_DIR: /data/registry/materials
      SPACK_RECIPE_BOOTSTRAP_MANIFEST: ${SPACK_RECIPE_BOOTSTRAP_MANIFEST:-}
      SPACK_MATERIAL_BOOTSTRAP_MANIFEST: ${SPACK_MATERIAL_BOOTSTRAP_MANIFEST:-}
      SPACK_UPSTREAM_ENABLED: ${SPACK_UPSTREAM_ENABLED:-false}
      SPACK_UPSTREAM_PROXY_URL: ${SPACK_UPSTREAM_PROXY_URL:-}
      SPACK_UPSTREAM_ALLOWED_ORIGINS: "${SPACK_UPSTREAM_ALLOWED_ORIGINS:-[]}"
      SPACK_UPSTREAM_TIMEOUT_MS: ${SPACK_UPSTREAM_TIMEOUT_MS:-300000}
      SPACK_UPSTREAM_IDLE_TIMEOUT_MS: ${SPACK_UPSTREAM_IDLE_TIMEOUT_MS:-30000}
      SPACK_UPSTREAM_MAX_CONCURRENT: ${SPACK_UPSTREAM_MAX_CONCURRENT:-2}
      SPACK_UPSTREAM_MAX_BYTES: ${SPACK_UPSTREAM_MAX_BYTES:-1073741824}
      SPACK_UPSTREAM_CA_BUNDLE: ${SPACK_UPSTREAM_CA_BUNDLE:-}
      # Public fixture value, used only by this local demo profile.
      DATA_MARKET_COMMITTER_SECRET_KEY: ${KQ_DATA_MARKET_COMMITTER_SECRET_KEY:-aio-test-committer-secret-not-for-production}

volumes:
  kq-aio-data:
