name: PR preview tests
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      ((github.event.action == 'labeled' && github.event.label.name != 'TRUST_PR_CREATOR') ||
       (github.event.action == 'unlabeled' && github.event.label.name != 'preview-paused'))
      && 'PR preview tests (ignored label event)' || 'PR preview tests' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request whose current head will be tested"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    pr-preview-tests-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}-${{
      ((github.event.action == 'labeled' && github.event.label.name != 'TRUST_PR_CREATOR') ||
       (github.event.action == 'unlabeled' && github.event.label.name != 'preview-paused'))
      && github.run_id || 'eligible' }}
  cancel-in-progress: true

jobs:
  resolve:
    name: resolve
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft &&
       !((github.event.action == 'labeled' && github.event.label.name != 'TRUST_PR_CREATOR') ||
         (github.event.action == 'unlabeled' && github.event.label.name != 'preview-paused')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Resolve the current trusted PR head
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const isPullRequest = context.eventName === "pull_request";
            if (!isPullRequest && context.eventName !== "workflow_dispatch") {
              throw new Error("Unsupported preview test event");
            }
            const rawNumber = isPullRequest
              ? String(context.payload.pull_request?.number ?? "")
              : context.payload.inputs?.pr_number;
            if (typeof rawNumber !== "string" || !/^[1-9][0-9]*$/.test(rawNumber)) {
              throw new Error("A positive pull request number is required");
            }
            const pullNumber = Number(rawNumber);
            if (!Number.isSafeInteger(pullNumber)) {
              throw new Error("Pull request number is out of range");
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.state !== "open" || pr.draft ||
                pr.head.repo?.full_name !== repository ||
                pr.base.repo?.full_name !== repository ||
                !/^[0-9a-f]{40}$/.test(pr.head.sha)) {
              throw new Error("Preview tests require an open non-draft same-repository PR");
            }
            if (isPullRequest) {
              if (context.payload.pull_request?.head?.sha !== pr.head.sha ||
                  context.payload.pull_request?.head?.repo?.full_name !== repository) {
                throw new Error("Pull request event no longer matches the current head");
              }
            } else if (context.ref !== `refs/heads/${pr.head.ref}` ||
                       context.sha !== pr.head.sha) {
              throw new Error("Dispatch must use the current pull request head branch and SHA");
            }
            core.setOutput("source_sha", pr.head.sha);

  ci:
    name: ci
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      run_runtime_checks: true

  schedulers:
    name: schedulers
    needs: resolve
    uses: ./.github/workflows/pr-scheduler-tests.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  workflows:
    name: workflows
    needs: resolve
    uses: ./.github/workflows/spack-workflow-execution.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  all-required-tests:
    name: all-required-tests
    needs: [resolve, ci, schedulers, workflows]
    if: always() && needs.resolve.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test suite to succeed
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          CI_RESULT: ${{ needs.ci.result }}
          SCHEDULERS_RESULT: ${{ needs.schedulers.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
        run: |
          if [[ "$RESOLVE_RESULT" == success &&
                "$CI_RESULT" == success &&
                "$SCHEDULERS_RESULT" == success &&
                "$WORKFLOWS_RESULT" == success ]]; then
            echo "All required preview tests passed"
          else
            echo "Required preview tests did not all succeed" >&2
            exit 1
          fi
