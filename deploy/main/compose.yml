name: kuintessence-main

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kq
      POSTGRES_DB: kuintessence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/deploy/.env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kq -d kuintessence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    command: ["rustfs", "/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  spicedb-migrate:
    image: authzed/spicedb:v1.54.0
    command: ["migrate", "head"]
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  spicedb:
    image: authzed/spicedb:v1.54.0
    restart: unless-stopped
    command: ["serve"]
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${AUTHZ_SPICEDB_TOKEN:?Set AUTHZ_SPICEDB_TOKEN}
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully

  db-migrate:
    image: ghcr.io/${KQ_IMAGE_OWNER:-kuintessence}/kuintessence-db-migrate:main
    pull_policy: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: ghcr.io/${KQ_IMAGE_OWNER:-kuintessence}/kuintessence-server:main
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_PORT: "3000"
      SERVER_GRPC_PORT: "3001"
      SERVER_CA_DIR: /var/lib/kuintessence/server-ca
      AUTHZ_MODE: enforce
      AUTHZ_SPICEDB_ENDPOINT: spicedb:50051
      AUTHZ_SPICEDB_TOKEN: ${AUTHZ_SPICEDB_TOKEN:?Set AUTHZ_SPICEDB_TOKEN}
      AUTHZ_SCHEMA_PATH: /app/authz/schema.zed
      MTLS_MODE: trusted-proxy
      MTLS_TRUSTED_PROXY_CIDRS: ${MTLS_TRUSTED_PROXY_CIDRS:?Set the Agent mTLS proxy CIDRs}
      HTTP_TRUSTED_PROXY_CIDRS: ${HTTP_TRUSTED_PROXY_CIDRS:-}
      WEB_BASE_URL: ${WEB_BASE_URL:?Set the public HTTPS Web URL}
      SSO_BOOTSTRAP_ENABLED: "true"
      SSO_BOOTSTRAP_ISSUER_URL: ${SSO_BOOTSTRAP_ISSUER_URL:?Set the SSO issuer URL}
      SSO_BOOTSTRAP_CLIENT_ID: ${SSO_BOOTSTRAP_CLIENT_ID:?Set the SSO client ID}
      SSO_BOOTSTRAP_CLIENT_SECRET: ${SSO_BOOTSTRAP_CLIENT_SECRET:?Set the SSO client secret}
      SSO_BOOTSTRAP_REDIRECT_URI: ${SSO_BOOTSTRAP_REDIRECT_URI:?Set the SSO callback URL}
      SSO_BOOTSTRAP_GROUP_MAPPING: "${SSO_BOOTSTRAP_GROUP_MAPPING:-{}}"
      SSO_BOOTSTRAP_AUTO_CREATE_USERS: "true"
      SPACK_MATERIAL_EPOCH: ${SPACK_MATERIAL_EPOCH:-}
      NETDRIVE_ENABLED: "false"
    volumes:
      - server-ca:/var/lib/kuintessence/server-ca
    ports:
      - "127.0.0.1:${SERVER_HTTP_PORT:-3000}:3000"
      - "127.0.0.1:${SERVER_GRPC_PORT:-3001}:3001"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      spicedb:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  registry:
    image: ghcr.io/${KQ_IMAGE_OWNER:-kuintessence}/kuintessence-registry:main
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REGISTRY_PORT: "3100"
      OFFLINE_DELIVERY_SEED: ${OFFLINE_DELIVERY_SEED:-}
      OFFLINE_DELIVERY_SEED_SUBJECT: ${OFFLINE_DELIVERY_SEED_SUBJECT:-}
      REGISTRY_AUTH_MODE: jwt
      REGISTRY_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      BLOB_STORE_DIR: /var/lib/kuintessence/registry/blobs
      SPACK_RECIPE_STORE_DIR: /var/lib/kuintessence/registry/recipes
      SPACK_MATERIAL_STORE_DIR: /var/lib/kuintessence/registry/materials
      SPACK_MATERIAL_EPOCH: ${SPACK_MATERIAL_EPOCH:-}
      SPACK_RECIPE_BOOTSTRAP_MANIFEST: ${SPACK_RECIPE_BOOTSTRAP_MANIFEST:-}
      SPACK_MATERIAL_BOOTSTRAP_MANIFEST: ${SPACK_MATERIAL_BOOTSTRAP_MANIFEST:-}
      ECOSYSTEM_RELEASE_TRUSTED_KEYS: "${ECOSYSTEM_RELEASE_TRUSTED_KEYS:-{}}"
    volumes:
      - registry-data:/var/lib/kuintessence/registry
      - ${KQ_SEED_DIRECTORY:-./seed}:/opt/kq-seed:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3100/api/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    image: ghcr.io/${KQ_IMAGE_OWNER:-kuintessence}/kuintessence-web:main
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
      registry:
        condition: service_healthy

volumes:
  pg-data:
  redis-data:
  rustfs-data:
  server-ca:
  registry-data:
