apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels: {{- include "kq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if eq .Values.server.env.MTLS_MODE "direct" }}
        kq.io/grpc-tls-credentials-revision: {{ .Values.server.grpcTls.credentialsRevision | quote }}
        {{- end }}
        {{- if .Values.netdrive.enabled }}
        kq.io/netdrive-bootstrap-revision: {{ printf "%s|%s" .Values.netdrive.accessKey .Values.netdrive.bootstrapRevision | sha256sum | quote }}
        {{- end }}
    spec:
      {{- include "kq.podPlacement" . | nindent 6 }}
      serviceAccountName: {{ include "kq.workloadWaitServiceAccountName" . }}
      initContainers:
        - name: wait-db-migration
          image: {{ .Values.migration.waitImage | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              attempts=0
              until kubectl get job/{{ include "kq.migrationName" . }} >/dev/null; do
                if [ "${attempts}" -ge 60 ]; then
                  echo "Database migration Job was not created within 120 seconds" >&2
                  exit 1
                fi
                sleep 2
                attempts=$((attempts + 1))
              done
              kubectl wait --for=condition=complete --timeout={{ .Values.migration.activeDeadlineSeconds }}s job/{{ include "kq.migrationName" . }}
      {{- if .Values.seed.enabled }}
        - name: wait-seed
          image: {{ .Values.migration.waitImage | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              attempts=0
              until kubectl get job/{{ include "kq.seedName" . }} >/dev/null; do
                [ "${attempts}" -lt 60 ] || exit 1
                sleep 2
                attempts=$((attempts + 1))
              done
              kubectl wait --for=condition=complete --timeout={{ add .Values.migration.activeDeadlineSeconds .Values.seed.activeDeadlineSeconds }}s job/{{ include "kq.seedName" . }}
      {{- end }}
      {{- if and .Values.rustfs.enabled .Values.netdrive.enabled }}
        - name: wait-rustfs-bootstrap
          image: {{ .Values.rustfs.bootstrapWaitImage | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              attempts=0
              until kubectl get job/{{ include "kq.rustfsBootstrapName" . }} >/dev/null; do
                if [ "${attempts}" -ge 60 ]; then
                  echo "RustFS bootstrap Job was not created within 120 seconds" >&2
                  exit 1
                fi
                sleep 2
                attempts=$((attempts + 1))
              done
              kubectl wait --for=condition=complete --timeout=15m job/{{ include "kq.rustfsBootstrapName" . }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "kq.image" .Values.server.image | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
            - name: grpc
              containerPort: {{ .Values.server.grpcPort }}
          env:
            {{- include "kq.databaseEnv" . | nindent 12 }}
            {{- include "kq.redisEnv" . | nindent 12 }}
            {{- if .Values.spackMaterial.epoch }}
            - name: SPACK_MATERIAL_EPOCH
              value: {{ .Values.spackMaterial.epoch | quote }}
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kq.secretName" . }}
                  key: JWT_SECRET
            {{- if eq .Values.server.env.MTLS_MODE "direct" }}
            - name: SERVER_CA_DIR
              value: /etc/kuintessence/ca
            - name: SERVER_GRPC_TLS_CERT_FILE
              value: /etc/kuintessence/tls/server.crt
            - name: SERVER_GRPC_TLS_KEY_FILE
              value: /etc/kuintessence/tls/server.key
            {{- end }}
            {{- if .Values.netdrive.enabled }}
            - name: DATA_MARKET_COMMITTER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kq.secretName" . }}
                  key: NETDRIVE_ACCESS_KEY
            - name: NETDRIVE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kq.secretName" . }}
                  key: NETDRIVE_ACCESS_KEY
            - name: NETDRIVE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kq.secretName" . }}
                  key: NETDRIVE_SECRET_KEY
            {{- end }}
            {{- range $name, $value := .Values.server.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.server.extraSecretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | quote }}
                  key: {{ .key | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          {{- if eq .Values.server.env.MTLS_MODE "direct" }}
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/kuintessence
              readOnly: true
          {{- end }}
      {{- if eq .Values.server.env.MTLS_MODE "direct" }}
      volumes:
        - name: grpc-tls
          secret:
            secretName: {{ default .Values.secrets.existingSecret .Values.server.grpcTls.existingSecret | quote }}
            defaultMode: 256 # 0400
            items:
              - key: SERVER_CA_CERT
                path: ca/ca.crt
              - key: SERVER_CA_KEY
                path: ca/ca.key
              - key: SERVER_TLS_CERT
                path: tls/server.crt
              - key: SERVER_TLS_KEY
                path: tls/server.key
      {{- end }}
