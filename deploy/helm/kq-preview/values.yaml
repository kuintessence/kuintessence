# CI supplies GHCR repositories and immutable sha-<fullsha> tags or digests.
# This wrapper owns no templates; all resources come from kq-platform.
kq-platform:
  global:
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
    imagePullSecrets: []
  preview:
    enabled: true
    host: ""
  secrets:
    existingSecret: kq-preview-secrets
  server:
    replicas: 1
    image:
      repository: ""
      tag: ""
    env:
      NODE_ENV: development
      AUTHZ_MODE: "off"
      SSO_BOOTSTRAP_ENABLED: "false"
      WEB_BASE_URL: "/"
      MTLS_MODE: direct
  registry:
    enabled: true
    replicas: 1
    image:
      repository: ""
      tag: ""
    persistence:
      enabled: true
      storage: 10Gi
    recipes:
      enabled: true
  web:
    enabled: true
    image:
      repository: ""
      tag: ""
  migration:
    image:
      repository: ""
      tag: ""
  seed:
    enabled: true
    mode: demo
    image:
      repository: ""
      tag: ""
  scheduler:
    enabled: true
    image:
      repository: ""
      tag: ""
  postgres:
    enabled: true
    storage: 5Gi
  redis:
    enabled: true
    storage: 1Gi
  rustfs:
    enabled: true
    storage: 10Gi
    consoleEnabled: false
  netdrive:
    enabled: true
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts: []
    tls: []
