server {
  listen 8080;
  server_name _;

  location = /healthz {
    return 200 "ok\n";
  }

  location /sso/ {
    rewrite ^/sso/(.*)$ /$1 redirect;
  }

  location = /sso {
    return 302 /;
  }

  location / {
    proxy_pass http://casdoor:8000;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
