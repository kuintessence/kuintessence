services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kq
      POSTGRES_PASSWORD: kq
      POSTGRES_DB: kuintessence
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kq -d kuintessence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0
    command: ["rustfs", "/data"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  server:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgres://kq:kq@postgres:5432/kuintessence
      REDIS_URL: redis://redis:6379
      JWT_SECRET: demo-secret-change-me-at-least-32-chars-long
      SERVER_PORT: "3000"
      SERVER_GRPC_PORT: "3001"
      LOG_LEVEL: info
      NODE_ENV: production
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  registry:
    build:
      context: ..
      dockerfile: packages/registry/Dockerfile
    environment:
      DATABASE_URL: postgres://kq:kq@postgres:5432/kuintessence
      REGISTRY_PORT: "3100"
      LOG_LEVEL: info
      NODE_ENV: production
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
  rustfs-data:
