# Ephemeral GitHub-hosted preview. Always use deploy/preview/preview.sh.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kq
      POSTGRES_PASSWORD: ${PREVIEW_DB_PASSWORD:?required}
      POSTGRES_DB: kuintessence
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kq -d kuintessence"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgres://kq:${PREVIEW_DB_PASSWORD:?required}@postgres:5432/kuintessence
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgres://kq:${PREVIEW_DB_PASSWORD:?required}@postgres:5432/kuintessence
      REDIS_URL: redis://unused:6379
      JWT_SECRET: ${PREVIEW_JWT_SECRET:?required}
      NODE_ENV: development
      LOG_LEVEL: warn
      SERVER_PORT: "3000"
      SERVER_GRPC_PORT: "3001"
      AUTHZ_MODE: "off"
      SSO_BOOTSTRAP_ENABLED: "false"
      NETDRIVE_ENABLED: "false"
      WEB_BASE_URL: "/"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  registry:
    build:
      context: .
      dockerfile: packages/registry/Dockerfile
    environment:
      DATABASE_URL: postgres://kq:${PREVIEW_DB_PASSWORD:?required}@postgres:5432/kuintessence
      REGISTRY_PORT: "3100"
      REGISTRY_AUTH_MODE: jwt
      REGISTRY_JWT_SECRET: ${PREVIEW_JWT_SECRET:?required}
      BLOB_STORE_DIR: /var/lib/kuintessence/registry
      SPACK_RECIPE_STORE_DIR: /var/lib/kuintessence/registry/recipes
      SPACK_MATERIAL_STORE_DIR: /var/lib/kuintessence/registry/materials
      SPACK_UPSTREAM_ENABLED: "false"
      SPACK_RECIPE_BOOTSTRAP_MANIFEST: ${SPACK_RECIPE_BOOTSTRAP_MANIFEST:-}
      SPACK_MATERIAL_BOOTSTRAP_MANIFEST: ${SPACK_MATERIAL_BOOTSTRAP_MANIFEST:-}
      LOG_LEVEL: warn
    volumes:
      - registry-data:/var/lib/kuintessence/registry
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_PREVIEW_LOGIN: "true"
    depends_on:
      server:
        condition: service_healthy
      registry:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    environment:
      PREVIEW_COOKIE: ${PREVIEW_COOKIE:?required}
      NGINX_ENVSUBST_FILTER: "^PREVIEW_COOKIE$"
    volumes:
      - ./deploy/preview/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/preview/unlock.html:/usr/share/nginx/html/unlock.html:ro
      - ${PREVIEW_STATE:?required}/htpasswd:/etc/nginx/preview.htpasswd:ro
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      web:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    command: ["tunnel", "--no-autoupdate", "--url", "http://gateway:8080"]
    profiles: [tunnel]
    depends_on:
      gateway:
        condition: service_started

volumes:
  pg-data:
  registry-data:
