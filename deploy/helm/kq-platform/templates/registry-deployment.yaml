{{- if .Values.registry.enabled }}
{{- if .Values.registry.recipes.enabled }}
{{- if not .Values.registry.persistence.enabled }}
{{- fail "registry.recipes.enabled requires registry.persistence.enabled" }}
{{- end }}
{{- if ne (toString .Values.registry.replicas) "1" }}
{{- fail "registry.recipes.enabled requires registry.replicas=1" }}
{{- end }}
{{- if not (hasPrefix "/" .Values.registry.persistence.mountPath) }}
{{- fail "registry recipe storage requires an absolute mountPath" }}
{{- end }}
{{- if and .Values.registry.recipes.bootstrapManifest (not (hasPrefix "/" .Values.registry.recipes.bootstrapManifest)) }}
{{- fail "registry.recipes.bootstrapManifest must be an absolute local path" }}
{{- end }}
{{- if and .Values.registry.recipes.materialBootstrapManifest (not (hasPrefix "/" .Values.registry.recipes.materialBootstrapManifest)) }}
{{- fail "registry.recipes.materialBootstrapManifest must be an absolute local path" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{- include "kq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.registry.replicas }}
  {{- if .Values.registry.recipes.enabled }}
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: registry
    spec:
      serviceAccountName: {{ include "kq.workloadWaitServiceAccountName" . }}
      initContainers:
        - name: wait-db-migration
          image: {{ .Values.migration.waitImage | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              attempts=0
              until kubectl get job/{{ include "kq.migrationName" . }} >/dev/null; do
                if [ "${attempts}" -ge 60 ]; then
                  echo "Database migration Job was not created within 120 seconds" >&2
                  exit 1
                fi
                sleep 2
                attempts=$((attempts + 1))
              done
              kubectl wait --for=condition=complete --timeout={{ .Values.migration.activeDeadlineSeconds }}s job/{{ include "kq.migrationName" . }}
      containers:
        - name: registry
          image: "{{ .Values.registry.image.repository }}:{{ .Values.registry.image.tag }}"
          imagePullPolicy: {{ .Values.registry.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.registry.port }}
          env:
            {{- include "kq.databaseEnv" . | nindent 12 }}
            - name: REGISTRY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kq.secretName" . }}
                  key: JWT_SECRET
            {{- if .Values.registry.persistence.enabled }}
            - name: BLOB_STORE_DIR
              value: {{ .Values.registry.persistence.mountPath | quote }}
            {{- end }}
            {{- if .Values.registry.recipes.enabled }}
            - name: SPACK_RECIPE_STORE_DIR
              value: {{ printf "%s/recipes" (trimSuffix "/" .Values.registry.persistence.mountPath) | quote }}
            - name: SPACK_MATERIAL_STORE_DIR
              value: {{ printf "%s/materials" (trimSuffix "/" .Values.registry.persistence.mountPath) | quote }}
            {{- if .Values.registry.recipes.bootstrapManifest }}
            - name: SPACK_RECIPE_BOOTSTRAP_MANIFEST
              value: {{ .Values.registry.recipes.bootstrapManifest | quote }}
            {{- end }}
            {{- if .Values.registry.recipes.materialBootstrapManifest }}
            - name: SPACK_MATERIAL_BOOTSTRAP_MANIFEST
              value: {{ .Values.registry.recipes.materialBootstrapManifest | quote }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.registry.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.registry.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources: {{- toYaml .Values.registry.resources | nindent 12 }}
          {{- if .Values.registry.persistence.enabled }}
          volumeMounts:
            - name: blob-storage
              mountPath: {{ .Values.registry.persistence.mountPath | quote }}
          {{- end }}
      {{- if .Values.registry.persistence.enabled }}
      volumes:
        - name: blob-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-registry-blobs
      {{- end }}
{{- end }}
