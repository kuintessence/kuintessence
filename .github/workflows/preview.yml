name: Preview
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Preview PR #{0}', github.event.pull_request.number) || format('Preview main - {0}', inputs.action) }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
  workflow_dispatch:
    inputs:
      action:
        description: "main 预览：start 启动 10 分钟；pause 停止并销毁"
        required: true
        type: choice
        default: start
        options: [start, pause]

permissions:
  contents: read
  pull-requests: read

jobs:
  preview:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'unlabeled' || github.event.label.name == 'preview-paused'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: preview-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      cancel-in-progress: true
    env:
      COMPOSE_PROJECT_NAME: kq-preview-${{ github.run_id }}-${{ github.run_attempt }}
      PREVIEW_PR: ${{ github.event.pull_request.number || '' }}
      PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check current preview request
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            let allowed = context.eventName === "workflow_dispatch" &&
              context.payload.inputs.action === "start";
            if (context.eventName === "pull_request") {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: context.payload.pull_request.number,
              });
              allowed = pr.state === "open" && !pr.draft &&
                pr.base.ref === "main" &&
                pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                pr.head.sha === context.payload.pull_request.head.sha &&
                !pr.labels.some(label => label.name === "preview-paused");
            }
            core.setOutput("allowed", String(allowed));
            if (!allowed) {
              await core.summary.addRaw("预览已暂停，或该 PR 已关闭、转为草稿、被更新。没有创建环境。").write();
            }

      - uses: actions/checkout@v4
        if: steps.request.outputs.allowed == 'true'
        with:
          persist-credentials: false

      - name: Prepare isolated preview credentials
        if: steps.request.outputs.allowed == 'true'
        env:
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
        run: bash deploy/preview/preview.sh prepare

      - name: Build preview images
        if: steps.request.outputs.allowed == 'true'
        timeout-minutes: 20
        run: bash deploy/preview/preview.sh build

      - name: Start preview and publish URL
        if: steps.request.outputs.allowed == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/preview/preview.sh start

      - name: Keep preview available for ten minutes
        if: steps.request.outputs.allowed == 'true'
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/preview/preview.sh hold

      - name: Destroy preview
        if: always() && steps.request.outputs.allowed == 'true'
        timeout-minutes: 3
        run: |
          if [[ -f deploy/preview/preview.sh ]]; then
            bash deploy/preview/preview.sh cleanup
          fi
