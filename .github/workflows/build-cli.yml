name: Build CLI binary

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "将构建产物上传到当前 v* tag 的 GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux CLI
        run: bun run --filter '@kuintessence/cli' build:linux

      - name: Smoke binary
        run: |
          smoke_dir="$(mktemp -d)"
          install -m 0755 packages/cli/dist/kq-linux-x64 "$smoke_dir/kq-linux-x64"
          cd "$smoke_dir"
          ./kq-linux-x64 --version
          (sleep 1; printf q) | timeout 10s script -qec \
            "./kq-linux-x64 tui --renderer-smoke" /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kq-linux-x64
          path: packages/cli/dist/kq-linux-x64
          retention-days: 14

  release:
    name: Attach CLI binary to GitHub release
    runs-on: ubuntu-latest
    needs: linux-x64
    if: inputs.publish_release && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: kq-linux-x64
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kq-linux-x64
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
