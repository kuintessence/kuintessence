apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kq.migrationName" . }}
  labels:
    {{- include "kq.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  # Retain the completion barrier until Helm replaces this revision.
  template:
    metadata:
      labels:
        {{- include "kq.labels" . | nindent 8 }}
        app.kubernetes.io/component: db-migration
    spec:
      {{- include "kq.podPlacement" . | nindent 6 }}
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "kq.image" .Values.migration.image | quote }}
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          env:
            {{- include "kq.databaseEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.migration.resources | nindent 12 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kq.workloadWaitServiceAccountName" . }}
  labels: {{- include "kq.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kq.workloadWaitServiceAccountName" . }}
  labels: {{- include "kq.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
    {{- if .Values.preview.enabled }}
    resourceNames:
      - {{ include "kq.migrationName" . }}
      {{- if .Values.seed.enabled }}
      - {{ include "kq.seedName" . }}
      {{- end }}
      {{- if and .Values.rustfs.enabled .Values.netdrive.enabled }}
      - {{ include "kq.rustfsBootstrapName" . }}
      {{- end }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kq.workloadWaitServiceAccountName" . }}
  labels: {{- include "kq.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kq.workloadWaitServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kq.workloadWaitServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
