name: Spack workflow execution

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      full_workflows:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spack-workflow-execution-${{ inputs.source_sha && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kq
          POSTGRES_PASSWORD: kq
          POSTGRES_DB: kuintessence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kq -d kuintessence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies without lifecycle scripts
        id: dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint and static contracts
        run: |
          bun run lint
          bash -n deploy/pr-test/run.sh
          bun scripts/check-doc-links.ts
          bun run check:workflow-uses
      - name: Generate protobuf and typecheck
        id: types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          bun run typecheck
          bun node_modules/typescript/bin/tsc --project deploy/pr-test/tsconfig.json
      - name: Verify workflow activation and acceptance contracts
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        run: |
          bun test packages/shared/src/workflow packages/shared/src/usecase \
            packages/server/src/workflow/job-submitter.test.ts \
            packages/server/src/grpc/dispatcher.test.ts \
            packages/agent/src/spack \
            packages/agent/src/adapters/slurm.test.ts \
            packages/agent/src/adapters/sandbox-adapters.test.ts \
            deploy/pr-test/spack-managed/jobs.test.ts \
            deploy/pr-test/spack-managed/workflow-contract.test.ts \
            deploy/pr-test/spack-managed/workflow-assets.test.ts \
            deploy/pr-test/spack-managed/session.test.ts \
            deploy/pr-test/spack-managed/file-workflow*.test.ts \
            scripts/spack-file-workflow.test.ts \
            scripts/spack-artifact-managed.test.ts scripts/spack-web-managed.test.ts
      - name: Verify Agent stream cancellation and dispatch regressions
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        run: bun test packages/agent/src/stream.test.ts
      - name: Verify database-backed workflow placement
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        env:
          DATABASE_URL: postgres://kq:kq@localhost:5432/kuintessence
          LOG_LEVEL: warn
        run: |
          bun run db:migrate
          bun test packages/server/src/services/placement-orchestrator.test.ts \
            packages/server/src/workflow/execution.integration.test.ts

  managed-workflow:
    name: Managed workflow (${{ matrix.case }})
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((inputs.full_workflows || github.event_name == 'workflow_dispatch')
              && '[{"case":"hello","flag":"--spack-workflow-hello"},{"case":"samtools","flag":"--spack-workflow-samtools"},{"case":"samtools-file","flag":"--spack-file-workflow-samtools"}]'
              || '[{"case":"hello","flag":"--spack-workflow-hello"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Permit the pinned Apptainer starter to create user namespaces
        id: managed-apparmor
        run: sudo apparmor_parser --replace deploy/pr-test/spack-managed/apparmor.profile
      - name: Verify material import, managed installation and workflow execution
        env:
          CASE_FLAG: ${{ matrix.flag }}
        run: >-
          timeout --signal=TERM --kill-after=60s 80m
          bash deploy/pr-test/run.sh slurm "$CASE_FLAG"
      - name: Remove the test-only AppArmor profile
        if: always() && steps.managed-apparmor.outcome == 'success'
        run: sudo apparmor_parser --remove deploy/pr-test/spack-managed/apparmor.profile
