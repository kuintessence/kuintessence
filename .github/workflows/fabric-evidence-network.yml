name: Fabric private data and evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/fabric-evidence-network.yml
      - contracts/fabric/**
      - packages/fabric-adapter/**
      - packages/shared/src/federation/**
      - packages/server/src/federation/**
      - packages/db/src/pg/schema-federation.ts
      - packages/db/migrations/**
      - scripts/fabric-evidence-*.ts
      - scripts/fabric-commercial-*.ts
      - scripts/fabric-market-*.ts
      - scripts/fabric-case-*.ts
      - scripts/federation-live/**
      - scripts/test-unit.ts
      - scripts/tsconfig.fabric.json
      - package.json
      - bun.lock

permissions:
  contents: read

concurrency:
  group: fabric-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kq
          POSTGRES_PASSWORD: kq
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kq -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate
      - name: Verify isolated test types and local contracts
        run: |
          bun run typecheck:fabric-tests
          bun run test:fabric
      - name: Install verified Fabric test binaries
        env:
          FABRIC_TEST_TOOLS: ${{ runner.temp }}/kq-fabric-3.1.5
        run: |
          mkdir -p "$FABRIC_TEST_TOOLS"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/hyperledger/fabric/releases/download/v3.1.5/hyperledger-fabric-linux-amd64-3.1.5.tar.gz \
            --output "$FABRIC_TEST_TOOLS/release.tar.gz"
          echo "b9c31fd490991e76f8acb1835dee09fc19fee5428cb13e190ee6e0bdd2c37858  $FABRIC_TEST_TOOLS/release.tar.gz" | sha256sum --check
          tar -xzf "$FABRIC_TEST_TOOLS/release.tar.gz" -C "$FABRIC_TEST_TOOLS"
      - name: Verify native privacy and database worker recovery
        env:
          KQ_FABRIC_TOOLS: ${{ runner.temp }}/kq-fabric-3.1.5
          KQ_FABRIC_DATABASE_URL: postgres://kq:kq@localhost:5432/postgres
          KQ_FABRIC_REPORT: ${{ runner.temp }}/fabric-evidence-result.json
        run: bun run test:fabric:integration
      - name: Verify private commercial agreements and database recovery
        env:
          KQ_FABRIC_TOOLS: ${{ runner.temp }}/kq-fabric-3.1.5
          KQ_FABRIC_DATABASE_URL: postgres://kq:kq@localhost:5432/postgres
          KQ_FABRIC_REPORT: ${{ runner.temp }}/fabric-commercial-result.json
        run: bun run test:fabric:commercial:integration
      - name: Verify public market claims and native majority endorsement
        env:
          KQ_FABRIC_TOOLS: ${{ runner.temp }}/kq-fabric-3.1.5
          KQ_FABRIC_REPORT: ${{ runner.temp }}/fabric-market-result.json
        run: bun run test:fabric:market
      - name: Verify isolated case privacy, three-party endorsement and crash recovery
        env:
          KQ_FABRIC_TOOLS: ${{ runner.temp }}/kq-fabric-3.1.5
          KQ_FABRIC_REPORT: ${{ runner.temp }}/fabric-case-result.json
        run: bun run test:fabric:cases
      - name: Verify private budget, execution gate races and database activation recovery
        env:
          KQ_FABRIC_TOOLS: ${{ runner.temp }}/kq-fabric-3.1.5
          KQ_FABRIC_REPORT: ${{ runner.temp }}/fabric-gate-result.json
          KQ_FABRIC_DATABASE_URL: postgres://kq:kq@localhost:5432/postgres
        run: bun run test:fabric:gate:integration
      - name: Verify arbitration withdrawal races and native replay endorsement
        env:
          KQ_FABRIC_TOOLS: ${{ runner.temp }}/kq-fabric-3.1.5
          KQ_FABRIC_REPORT: ${{ runner.temp }}/fabric-arbitration-result.json
        run: bun scripts/fabric-evidence-network.ts --gate --arbitration-revocation
      - name: Preserve arbitration assertion summary
        uses: actions/upload-artifact@v4
        with:
          name: fabric-arbitration-result
          path: ${{ runner.temp }}/fabric-arbitration-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve execution gate assertion summary
        uses: actions/upload-artifact@v4
        with:
          name: fabric-gate-result
          path: ${{ runner.temp }}/fabric-gate-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve market assertion summary
        uses: actions/upload-artifact@v4
        with:
          name: fabric-market-result
          path: ${{ runner.temp }}/fabric-market-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve commercial assertion summary
        uses: actions/upload-artifact@v4
        with:
          name: fabric-commercial-result
          path: ${{ runner.temp }}/fabric-commercial-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve case assertion summary
        uses: actions/upload-artifact@v4
        with:
          name: fabric-case-result
          path: ${{ runner.temp }}/fabric-case-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve assertion summary
        uses: actions/upload-artifact@v4
        with:
          name: fabric-evidence-result
          path: ${{ runner.temp }}/fabric-evidence-result.json
          if-no-files-found: error
          retention-days: 14
