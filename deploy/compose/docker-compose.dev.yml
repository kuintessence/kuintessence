services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kq
      POSTGRES_PASSWORD: kq
      POSTGRES_DB: kuintessence
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kq -d kuintessence"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:1.0.0
    command: ["rustfs", "/data"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  spicedb-migrate:
    image: ${KQ_SPICEDB_IMAGE:-authzed/spicedb:v1.54.0}
    command:
      [
        "migrate",
        "head",
        "--datastore-engine",
        "postgres",
        "--datastore-conn-uri",
        "${KQ_SPICEDB_DATASTORE_CONN_URI:-postgres://kq:kq@postgres:5432/kuintessence?sslmode=disable}",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  spicedb:
    image: ${KQ_SPICEDB_IMAGE:-authzed/spicedb:v1.54.0}
    command:
      [
        "serve",
        "--grpc-preshared-key",
        "${KQ_SPICEDB_PRESHARED_KEY:-local-dev-authz}",
        "--datastore-engine",
        "postgres",
        "--datastore-conn-uri",
        "${KQ_SPICEDB_DATASTORE_CONN_URI:-postgres://kq:kq@postgres:5432/kuintessence?sslmode=disable}",
      ]
    ports:
      - "${KQ_SPICEDB_GRPC_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "spicedb",
          "datastore",
          "head",
          "--datastore-engine",
          "postgres",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  casdoor-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: casdoor_dev_password
      POSTGRES_DB: casdoor
    ports:
      - "${KQ_CASDOOR_POSTGRES_PORT:-15433}:5432"
    volumes:
      - casdoor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor -d casdoor"]
      interval: 5s
      timeout: 5s
      retries: 10

  casdoor:
    build:
      context: deploy/casdoor
      dockerfile: Dockerfile
    environment:
      RUNNING_IN_DOCKER: "true"
      defaultLanguage: zh
      forceLanguage: zh
    volumes:
      - ./deploy/casdoor/app.conf:/conf/app.conf:ro
      - ./deploy/casdoor/init_data.json:/init_data.json:ro
    depends_on:
      casdoor-postgres:
        condition: service_healthy

  casdoor-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/casdoor/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${KQ_CASDOOR_HTTP_PORT:-15180}:8080"
    depends_on:
      casdoor:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  rustfs_data:
  casdoor_pg_data:
