name: PR scheduler tests

on:
  workflow_dispatch:
    inputs:
      run_spack:
        description: "Run Spack managed installation and single-step cases"
        type: boolean
        default: true
      run_schedulers:
        description: "Run the Slurm and PBS scheduler matrix"
        type: boolean
        default: true
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      run_spack:
        type: boolean
        default: true
      run_schedulers:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pr-scheduler-tests-${{ inputs.source_sha && github.run_id || github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spack-managed:
    name: Spack ${{ matrix.label }} managed installation
    if: inputs.run_spack
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: GNU Hello
            flag: --spack-managed
            web: false
          - label: samtools
            flag: --spack-samtools
            web: false
          - label: GNU Hello artifact bootstrap
            flag: --spack-artifact-hello
            web: false
          - label: samtools artifact bootstrap
            flag: --spack-artifact-samtools
            web: false
          - label: GNU Hello Web import
            flag: --spack-web-hello
            web: true
          - label: samtools Web import
            flag: --spack-web-samtools
            web: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun for Web import
        if: matrix.web == true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install Web import dependencies
        if: matrix.web == true
        run: bun install --frozen-lockfile
      - name: Generate protobuf stubs for Web import
        if: matrix.web == true
        run: bun run --filter @kuintessence/proto generate
      - name: Install isolated browser for Web import
        if: matrix.web == true
        working-directory: packages/web
        run: bun run e2e:install
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Permit the pinned Apptainer starter to create user namespaces
        id: managed-apparmor
        run: sudo apparmor_parser --replace deploy/pr-test/spack-managed/apparmor.profile
      - name: Verify isolated managed install, restart and uninstall
        env:
          CASE_FLAG: ${{ matrix.flag }}
        run: timeout --signal=TERM --kill-after=60s 65m bash deploy/pr-test/run.sh slurm "$CASE_FLAG"
      - name: Remove the test-only AppArmor profile
        if: always() && steps.managed-apparmor.outcome == 'success'
        run: sudo apparmor_parser --remove deploy/pr-test/spack-managed/apparmor.profile

  spack-case:
    name: Spack GNU Hello single-step case
    if: inputs.run_spack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Deliver materials, compile offline and run one Slurm step
        run: timeout --signal=TERM --kill-after=60s 55m bash deploy/pr-test/run.sh slurm --spack-case

  scheduler:
    name: Scheduler (${{ matrix.scheduler }})
    if: inputs.run_schedulers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scheduler: [slurm, pbs]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and test disposable scheduler stack
        env:
          SCHEDULER: ${{ matrix.scheduler }}
        run: timeout --signal=TERM --kill-after=60s 40m bash deploy/pr-test/run.sh "$SCHEDULER"
