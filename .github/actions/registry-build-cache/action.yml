name: Set up registry build cache
description: Configure Buildx and authenticate to the repository's GHCR build cache.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    # Readers can cold-build during a registry outage. The warmer requires a successful export.
    - uses: docker/login-action@v3
      continue-on-error: true
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - shell: bash
      run: echo "KQ_CI_BUILD_CACHE=ghcr.io/${GITHUB_REPOSITORY,,}-buildcache" >> "$GITHUB_ENV"
