name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      generate_db_migrations:
        description: "生成数据库 migration artifact，供审阅后带回仓库"
        required: true
        type: boolean
        default: false
      run_runtime_checks:
        description: "运行完整检查：生成代码、Helm 测试、数据库和容器测试"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-db-migrations:
    name: Generate database migrations
    if: github.event_name == 'workflow_dispatch' && inputs.generate_db_migrations == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate database migrations
        run: bun run db:generate

      - name: Upload database migrations for review
        uses: actions/upload-artifact@v4
        with:
          name: pg-migrations-${{ github.sha }}
          path: packages/db/migrations/
          retention-days: 7
          if-no-files-found: error

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint (Biome)
        run: bun run lint --max-diagnostics=100

      - name: Check local documentation links
        run: bun scripts/check-doc-links.ts

      - name: Check workflow references
        run: bun run check:workflow-uses

      - name: Check scientific workflow handoff templates
        run: bun test scripts/spack-workflow-handoff.test.ts

      - name: Type check workflow handoff contracts
        run: >-
          bun node_modules/typescript/bin/tsc --noEmit --strict
          --noUncheckedIndexedAccess --skipLibCheck --target ESNext
          --module ESNext --moduleResolution bundler --types bun-types
          scripts/spack-workflow-handoff.test.ts

  lint-and-typecheck:
    name: Full typecheck + Helm validation
    if: github.event_name == 'workflow_dispatch' && inputs.run_runtime_checks
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Render Helm deployment profiles
        run: bun run test:helm

      - name: Check RustFS bootstrap and deployment wiring
        run: bun test scripts/rustfs-*.test.ts scripts/compose.test.ts

      - name: Check Spack material delivery and deployment contracts
        run: >-
          bun test scripts/spack-material-delivery.test.ts
          scripts/spack-material-rollout-deployment.test.ts scripts/pr-scheduler-compose.test.ts
          deploy/pr-test/spack-case/fixture.test.ts deploy/pr-test/spack-managed/jobs.test.ts
          scripts/spack-material-artifacts.test.ts scripts/spack-artifact-managed.test.ts
          scripts/spack-web-managed.test.ts
          deploy/pr-test/spack-artifacts/*.test.ts

      - name: Type check (all packages)
        run: bun run typecheck

      - name: Type check PR acceptance harness
        run: bun node_modules/typescript/bin/tsc --project deploy/pr-test/tsconfig.json

  spack-artifact-imports:
    name: Spack artifact imports (${{ matrix.case }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_runtime_checks
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        case: [hello, samtools]
    uses: ./.github/workflows/spack-material-artifacts.yml
    with:
      case: ${{ matrix.case }}
      recipe_repository: public/ci-artifact-${{ matrix.case }}-recipes
      material_repository: public/ci-artifact-${{ matrix.case }}-sources
      publish_artifact: false
      acknowledge_redistribution: false

  test:
    name: Unit + integration tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_runtime_checks
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kq
          POSTGRES_PASSWORD: kq
          POSTGRES_DB: kuintessence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kq -d kuintessence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate

      - name: Run database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://kq:kq@localhost:5432/kuintessence

      - name: Run isolated unit tests
        run: bun run test:unit
        env:
          DATABASE_URL: postgres://kq:kq@localhost:5432/kuintessence
          REDIS_URL: redis://localhost:6379
          LOG_LEVEL: warn

      - name: Run Agent integration tests
        run: bun run test:integration
        env:
          DATABASE_URL: postgres://kq:kq@localhost:5432/kuintessence
          REDIS_URL: redis://localhost:6379
          LOG_LEVEL: warn

  e2e-slice:
    name: E2E slice (CLI -> Server -> Agent -> Slurm)
    if: github.event_name == 'workflow_dispatch' && inputs.run_runtime_checks
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate

      - name: Run e2e slice
        run: bun run test:e2e

  rustfs-deployments:
    name: RustFS Compose + AIO
    if: github.event_name == 'workflow_dispatch' && inputs.run_runtime_checks
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose and run disposable RustFS AIO
        run: bash deploy/rustfs/ci.sh

  spack-lifecycle-portal:
    name: Spack lifecycle portal
    if: github.event_name == 'workflow_dispatch' && inputs.run_runtime_checks
    needs: static-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate
      - name: Verify lifecycle clients and portal sessions
        working-directory: packages/web
        run: >-
          bun run test
          src/lib/spack-material-lifecycle-client.test.ts
          src/lib/spack-material-management-client.test.ts
          src/lib/spack-material-visibility-client.test.ts
          src/lib/spack-materials-client.test.ts
          src/components/software/MaterialLifecycle*.test.tsx
          src/components/software/SpackMaterials*.test.tsx
          src/components/software/MaterialCatalog*.test.tsx
          src/components/software/MaterialManagementCatalog*.test.tsx
          src/components/software/MaterialManagementSession.test.tsx
          src/components/software/MaterialManagementEditors.test.tsx
          src/components/software/MaterialVisibility*.test.tsx
          src/components/software/SpackOnlineImport.test.tsx
          src/routes/-cp-capability-errors.test.tsx
      - name: Build web application and styles
        working-directory: packages/web
        run: bun run build
      - name: Install Chromium for isolated browser tests
        working-directory: packages/web
        run: bunx patchright install --with-deps chromium
      - name: Verify desktop and mobile lifecycle interactions
        working-directory: packages/web
        run: bun run e2e --config=e2e/material-lifecycle.config.ts
      - name: Upload lifecycle browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spack-lifecycle-portal-${{ github.sha }}
          path: packages/web/test-results/material-lifecycle/**/*.png
          retention-days: 7
          if-no-files-found: warn

  spack-upstream:
    name: Spack HTTP and SOCKS online imports
    if: github.event_name == 'workflow_dispatch' && inputs.run_runtime_checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies without lifecycle scripts
        id: upstream-dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify controlled import contracts in isolated processes
        run: |
          status=0
          for test_file in \
            packages/shared/src/spack-upstream.test.ts \
            packages/registry/src/spack-upstream-config.test.ts \
            packages/registry/src/services/spack-upstream-policy.test.ts \
            packages/registry/src/services/spack-upstream-import.test.ts \
            packages/registry/src/routes/spack-upstream.test.ts \
            packages/registry/src/services/recipe-git.test.ts \
            packages/registry/src/services/recipe-git-store.test.ts \
            scripts/spack-upstream-deployment.test.ts \
            scripts/recipe-proxy-config.test.ts \
            scripts/recipe-vite-proxy.test.ts
          do
            timeout --signal=TERM --kill-after=5s 90s \
              bun test --timeout=15000 "$test_file" || status=1
          done
          exit "$status"
      - name: Verify real HTTP CONNECT and SOCKS transfers
        if: ${{ !cancelled() && steps.upstream-dependencies.outcome == 'success' }}
        run: >-
          timeout --signal=TERM --kill-after=5s 180s
          bun test --timeout=15000 packages/registry/src/services/spack-upstream-download.test.ts
      - name: Verify online import browser state and client contract
        if: ${{ !cancelled() && steps.upstream-dependencies.outcome == 'success' }}
        working-directory: packages/web
        run: >-
          timeout --signal=TERM --kill-after=5s 180s
          bun run test
          src/lib/spack-upstream-client.test.ts
          src/components/software/SpackOnlineImport.test.tsx
          src/components/software/RecipeRepositoriesPanel.test.tsx
          src/components/software/RecipeRepositorySession.test.tsx
          src/components/software/SpackMaterialsPanel.test.tsx
          src/components/software/SpackMaterialsSession.test.tsx
