name: Preview
run-name: Remote k3s preview

on:
  workflow_run:
    workflows: [PR preview tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Trusted PR to deploy"
        required: true
        type: string
      test_run_id:
        description: "Successful PR preview tests run for the current head"
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_run' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      pr: ${{ steps.check.outputs.pr }}
      sha: ${{ steps.check.outputs.sha }}
      owner: ${{ steps.check.outputs.owner }}
      run: ${{ steps.check.outputs.run }}
      url: ${{ steps.check.outputs.url }}
    steps:
      # Never use the PR checkout for privileged deployment orchestration.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify live PR trust and complete test evidence
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            await require("./deploy/preview/gate.cjs").gate({github, context, core});

  images:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push tested amd64 images
        working-directory: source
        env:
          IMAGE_PREFIX: ghcr.io/${{ needs.gate.outputs.owner }}/kq-dev
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
          REVISION: ${{ needs.gate.outputs.sha }}
        run: >-
          docker buildx bake --file ../tooling/deploy/preview/images.hcl
          --push --metadata-file "$RUNNER_TEMP/kq-images-metadata.json"
      - name: Record immutable image digests
        env:
          IMAGE_OWNER: ${{ needs.gate.outputs.owner }}
          PREVIEW_SHA: ${{ needs.gate.outputs.sha }}
        run: >-
          node tooling/deploy/preview/images.cjs collect
          "$RUNNER_TEMP/kq-images-metadata.json" "$RUNNER_TEMP/kq-images.json"
      - uses: actions/upload-artifact@v4
        with:
          name: kq-preview-images-${{ needs.gate.outputs.sha }}
          path: ${{ runner.temp }}/kq-images.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [gate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: kq-preview-pr-${{ needs.gate.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
      deployments: write
    env:
      PREVIEW_PR: ${{ needs.gate.outputs.pr }}
      PREVIEW_SHA: ${{ needs.gate.outputs.sha }}
      TEST_RUN_ID: ${{ needs.gate.outputs.run }}
      IMAGE_OWNER: ${{ needs.gate.outputs.owner }}
      IMAGE_MANIFEST: ${{ runner.temp }}/kq-preview-images/kq-images.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kq-preview-images-${{ needs.gate.outputs.sha }}
          path: ${{ runner.temp }}/kq-preview-images
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Recheck after image builds and deployment queue
        id: recheck
        uses: actions/github-script@v7
        with:
          script: |
            await require("./deploy/preview/gate.cjs").gate({github, context, core}, {
              pr: process.env.PREVIEW_PR, runId: process.env.TEST_RUN_ID,
            });
      - name: Record deployment start
        if: steps.recheck.outputs.allowed == 'true'
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.createDeployment({
              ...context.repo, ref: process.env.PREVIEW_SHA,
              environment: `pr-${process.env.PREVIEW_PR}`,
              auto_merge: false, required_contexts: [],
              transient_environment: true, production_environment: false,
              description: "Test-gated k3s preview",
            });
            core.setOutput("id", data.id);
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: data.id, state: "in_progress",
            });
      - name: Deploy through SSH and verify HTTPS
        id: helm
        if: steps.recheck.outputs.allowed == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: bash deploy/preview/remote.sh deploy
      - name: Recheck before publishing the URL
        if: success() && steps.recheck.outputs.allowed == 'true'
        id: final-check
        uses: actions/github-script@v7
        with:
          script: |
            await require("./deploy/preview/gate.cjs").gate({github, context, core}, {
              pr: process.env.PREVIEW_PR, runId: process.env.TEST_RUN_ID,
            });
      - name: Remove deployment superseded or revoked while Helm was running
        if: always() && steps.helm.outputs.applied == 'true' && steps.final-check.outputs.allowed != 'true'
        id: removed
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: bash deploy/preview/remote.sh cleanup
      - name: Mark the superseded preview as removed
        if: always() && steps.removed.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await require("./deploy/preview/notice.cjs").notice(
              {github, context, core}, "inactive", process.env.PREVIEW_PR,
            );
      - name: Publish the verified preview URL
        if: success() && steps.final-check.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await require("./deploy/preview/notice.cjs").notice(
              {github, context, core}, "success", process.env.PREVIEW_PR, process.env.PREVIEW_SHA,
            );
      - name: Record deployment outcome
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          JOB_STATUS: ${{ job.status }}
          FINAL_ALLOWED: ${{ steps.final-check.outputs.allowed }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success" && process.env.FINAL_ALLOWED === "true";
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: success ? "success" : "failure",
              environment_url: success ? `https://pr-${process.env.PREVIEW_PR}.preview.dev.kuintessence.com` : undefined,
              description: success ? "HTTPS preview ready" : "Preview failed or was superseded; no new URL published",
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
