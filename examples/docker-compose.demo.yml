services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kq
      POSTGRES_PASSWORD: kq
      POSTGRES_DB: kuintessence
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kq -d kuintessence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  server:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgres://kq:kq@postgres:5432/kuintessence
      REDIS_URL: redis://redis:6379
      JWT_SECRET: demo-secret-change-me-at-least-32-chars-long
      SERVER_PORT: "3000"
      SERVER_GRPC_PORT: "3001"
      LOG_LEVEL: info
      NODE_ENV: production
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  registry:
    build:
      context: ..
      dockerfile: packages/registry/Dockerfile
    environment:
      DATABASE_URL: postgres://kq:kq@postgres:5432/kuintessence
      REGISTRY_PORT: "3100"
      LOG_LEVEL: info
      NODE_ENV: production
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
  minio-data:
