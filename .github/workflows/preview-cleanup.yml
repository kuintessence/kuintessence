name: Preview Cleanup

on:
  pull_request_target:
    branches: [main]
    types: [closed, converted_to_draft, labeled]

permissions:
  actions: write
  pull-requests: read

jobs:
  cancel:
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'preview-paused'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This privileged job only reads event metadata; it never checks out PR code.
      - name: Cancel this pull request's preview runs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number,
            });
            if (current.state === "open" && !current.draft &&
                !current.labels.some(label => label.name === "preview-paused")) {
              core.info("PR has already resumed; ignoring this stale cleanup event");
              return;
            }
            const runs = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: "preview.yml",
              event: "pull_request",
              branch: pr.head.ref,
              per_page: 100,
            });
            for await (const { data } of runs) {
              for (const run of data) {
                if (run.status === "completed" ||
                    run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                    run.display_title !== `Preview PR #${pr.number}`) continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    ...context.repo, run_id: run.id,
                  });
                  core.info(`Cancellation requested for preview run ${run.id}`);
                } catch (error) {
                  if (error.status !== 409) throw error;
                  core.info(`Preview run ${run.id} has already stopped`);
                }
              }
            }
