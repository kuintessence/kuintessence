name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      run_runtime_checks:
        type: boolean
        default: true
      run_spack:
        type: boolean
        default: true
      run_schedulers:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      generate_db_migrations:
        description: "生成数据库 migration artifact，供审阅后带回仓库"
        required: true
        type: boolean
        default: false
      run_runtime_checks:
        description: "运行完整检查：生成代码、Helm 测试、数据库和容器测试"
        required: true
        type: boolean
        default: false
      run_spack:
        description: "启用运行检查时，运行 Spack 材料、导入和门户测试"
        type: boolean
        default: true
      run_schedulers:
        description: "启用运行检查时，运行真实调度器 E2E"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.source_sha && github.run_id || github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-db-migrations:
    name: Generate database migrations
    if: github.event_name == 'workflow_dispatch' && inputs.generate_db_migrations == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate database migrations
        run: bun run db:generate

      - name: Upload database migrations for review
        uses: actions/upload-artifact@v4
        with:
          name: pg-migrations-${{ github.sha }}
          path: packages/db/migrations/
          retention-days: 7
          if-no-files-found: error

  static-checks:
    name: Static checks
    outputs:
      web_artifact: web-dist-${{ github.run_id }}-${{ github.run_attempt }}
    if: >-
      github.event_name != 'pull_request' || inputs.source_sha ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint (Biome)
        run: bun run lint --max-diagnostics=100

      - name: Check local documentation links
        run: bun scripts/check-doc-links.ts

      - name: Check workflow references
        run: bun run check:workflow-uses

      - name: Check production image publication contracts
        run: bun test scripts/production-images.test.cjs scripts/main-deploy.test.cjs scripts/agent-bundle.test.cjs scripts/offline-delivery.test.cjs

      - name: Check offline Slurm site bootstrap and maintenance
        run: |
          for test_file in tests/test_site_bootstrap.py tests/test_site_bootstrap_integration.py tests/test_site_maintenance.py tests/test_site_shared_recovery.py tests/test_slurm_user_site.py; do
            python3 "$test_file" || exit
          done

      - name: Check signed site release preparation and publication contracts
        run: bun test deploy/site-release/prepare.test.ts deploy/site-release/publish.test.ts

      - name: Check disposable PostgreSQL acceptance contracts
        run: bun test scripts/test-unit.test.ts

      - name: Check scientific workflow handoff templates
        run: bun test scripts/spack-workflow-handoff.test.ts

      - name: Check business catalog metadata revisions
        run: python3 tests/test_ecosystem_business_catalog.py

      - name: Type check workflow handoff contracts
        run: >-
          bun node_modules/typescript/bin/tsc --noEmit --strict
          --noUncheckedIndexedAccess --skipLibCheck --target ESNext
          --module ESNext --moduleResolution bundler --types bun-types
          scripts/spack-workflow-handoff.test.ts

      - name: Check preview test orchestration contracts
        run: bun test scripts/preview-tests.test.ts
      - name: Check selective CI scope policy
        run: >-
          bun test deploy/preview/test-scope.test.cjs deploy/preview/ci-scope.test.cjs deploy/preview/scoped-gate.test.cjs
          deploy/preview/workflow-scope.test.cjs
      - name: Check CP browser installation contracts
        run: bun test scripts/spack-web-managed.test.ts
      - name: Check CP inventory refresh regression
        working-directory: packages/web
        run: bun run test src/lib/use-cp-software.test.ts

      - name: Generate protobuf stubs for Web build
        run: bun run --filter @kuintessence/proto generate
      - name: Build Web for isolated UI regression tests
        working-directory: packages/web
        run: bun run build
      - name: Share the identical Web build with lifecycle browser checks
        if: inputs.run_runtime_checks || inputs.source_sha
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/web/dist/
          if-no-files-found: error
          retention-days: 1
      - name: Install Chromium and screenshot fonts
        working-directory: packages/web
        run: |
          bunx --no-install patchright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-liberation
      - name: Verify shared UI and key page screenshots
        working-directory: packages/web
        run: bunx --no-install patchright test --config=e2e/ui-components.config.ts
      - name: Verify Vite development login entry
        working-directory: packages/web
        run: bunx --no-install patchright test --config=e2e/dev-login.config.ts
      - name: Upload UI browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-${{ github.run_id }}
          path: packages/web/test-results/ui-components/
          retention-days: 7
          if-no-files-found: warn

  lint-and-typecheck:
    name: Full typecheck + Helm validation
    if: inputs.run_runtime_checks || inputs.source_sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Render Helm deployment profiles
        run: bun run test:helm

      - name: Check RustFS bootstrap and deployment wiring
        run: bun test scripts/rustfs-*.test.ts scripts/compose.test.ts deploy/rustfs/*.test.cjs

      - name: Check preview deployment and seed contracts
        run: bun test deploy/preview/*.test.* deploy/seed/*.test.*

      - name: Verify preview gateway and initialization images
        env:
          KQ_RUN_CONTAINER_CONTRACTS: "1"
        run: bun test scripts/helm-preview-gateway.test.ts scripts/helm-preview-wait-image.test.ts

      - name: Validate preview image publishing configuration without building
        env:
          IMAGE_PREFIX: ghcr.io/example/kq-dev
          IMAGE_SOURCE: https://github.com/example/example
          REVISION: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          IMAGE_TAG: pr-1-sha-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-run-1-1
        run: >-
          docker buildx bake --file deploy/preview/images.hcl
          --provenance=false --sbom=false --print

      - name: Check preview script syntax
        run: |
          for script in deploy/preview/*.cjs; do
            node --check "$script"
          done
          bash -n deploy/preview/remote.sh

      - name: Check Spack material delivery and deployment contracts
        run: >-
          bun test scripts/spack-material-delivery.test.ts
          scripts/spack-material-rollout-deployment.test.ts scripts/pr-scheduler-compose.test.ts
          deploy/pr-test/spack-case/fixture.test.ts deploy/pr-test/spack-managed/jobs.test.ts
          scripts/spack-material-artifacts.test.ts scripts/spack-artifact-managed.test.ts
          scripts/spack-web-managed.test.ts
          deploy/pr-test/spack-artifacts/*.test.ts

      - name: Verify real SSH image layer delivery on the disposable runner
        run: |
          if [[ ! -x /usr/sbin/sshd ]]; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
          bash deploy/main/relay-ci.sh

      - name: Type check (all packages)
        run: bun run typecheck

      - name: Type check PR acceptance harness
        run: bun node_modules/typescript/bin/tsc --project deploy/pr-test/tsconfig.json

      - name: Type check preview seed
        run: bun node_modules/typescript/bin/tsc --project deploy/seed/tsconfig.json

      - name: Run complete Web unit suite
        working-directory: packages/web
        run: bun run test

  spack-artifact-imports:
    name: Spack artifact imports (${{ matrix.case }})
    if: (inputs.run_runtime_checks || inputs.source_sha) && inputs.run_spack
    strategy:
      fail-fast: false
      matrix:
        case: [hello, samtools]
    uses: ./.github/workflows/spack-material-artifacts.yml
    with:
      source_sha: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      case: ${{ matrix.case }}
      recipe_repository: public/ci-artifact-${{ matrix.case }}-recipes
      material_repository: public/ci-artifact-${{ matrix.case }}-sources
      publish_artifact: false
      acknowledge_redistribution: false

  unit-tests:
    name: Isolated unit tests (${{ matrix.shard }}/4)
    if: inputs.run_runtime_checks || inputs.source_sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kq
          POSTGRES_PASSWORD: kq
          POSTGRES_DB: kuintessence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kq -d kuintessence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate

      - name: Run isolated unit tests
        run: bun run test:unit --shard ${{ matrix.shard }}/4
        env:
          DATABASE_URL: postgres://kq:kq@localhost:5432/kuintessence
          REDIS_URL: redis://localhost:6379
          LOG_LEVEL: warn

  test:
    name: Unit + integration tests
    if: always() && (inputs.run_runtime_checks || inputs.source_sha)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kq
          POSTGRES_PASSWORD: kq
          POSTGRES_DB: kuintessence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kq -d kuintessence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Require all four isolated unit shards
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
        run: test "$UNIT_RESULT" = success

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate

      - name: Run database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://kq:kq@localhost:5432/kuintessence

      - name: Run seed PostgreSQL contracts
        run: bun test deploy/seed/store.test.ts
        env:
          SEED_TEST_DATABASE_URL: postgres://kq:kq@localhost:5432/kuintessence
          LOG_LEVEL: warn

      - name: Type check cross-package workflow contracts
        run: >-
          bun node_modules/typescript/bin/tsc --noEmit --strict
          --noUncheckedIndexedAccess --skipLibCheck --target ESNext
          --module ESNext --moduleResolution bundler --types bun-types
          scripts/workflow-software.pg.test.ts

      - name: Run Agent integration tests
        run: bun run test:integration
        env:
          DATABASE_URL: postgres://kq:kq@localhost:5432/kuintessence
          REDIS_URL: redis://localhost:6379
          LOG_LEVEL: warn

  e2e-slice:
    name: E2E slice (CLI -> Server -> Agent -> Slurm)
    if: (inputs.run_runtime_checks || inputs.source_sha) && inputs.run_schedulers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate

      - name: Run e2e slice
        run: bun run test:e2e

  rustfs-deployments:
    name: RustFS Compose + AIO
    if: inputs.run_runtime_checks || inputs.source_sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate Compose and run disposable RustFS AIO
        run: bash deploy/rustfs/ci.sh

  spack-lifecycle-portal:
    name: Spack lifecycle portal
    needs: static-checks
    if: inputs.run_runtime_checks || inputs.source_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate
      - name: Reuse the checked default Web build
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.static-checks.outputs.web_artifact }}
          path: packages/web/dist/
      - name: Install Chromium for isolated browser tests
        working-directory: packages/web
        run: bunx patchright install --with-deps chromium
      - name: Verify desktop and mobile lifecycle interactions
        working-directory: packages/web
        run: bun run e2e --config=e2e/material-lifecycle.config.ts
      - name: Upload lifecycle browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spack-lifecycle-portal-${{ github.sha }}
          path: packages/web/test-results/material-lifecycle/**/*.png
          retention-days: 7
          if-no-files-found: warn

  spack-upstream:
    name: Spack HTTP and SOCKS online imports
    if: (inputs.run_runtime_checks || inputs.source_sha) && inputs.run_spack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies without lifecycle scripts
        id: upstream-dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify controlled import contracts in isolated processes
        run: |
          status=0
          for test_file in \
            packages/shared/src/spack-upstream.test.ts \
            packages/registry/src/spack-upstream-config.test.ts \
            packages/registry/src/services/spack-upstream-policy.test.ts \
            packages/registry/src/services/spack-upstream-import.test.ts \
            packages/registry/src/routes/spack-upstream.test.ts \
            packages/registry/src/services/recipe-git.test.ts \
            packages/registry/src/services/recipe-git-store.test.ts \
            scripts/spack-upstream-deployment.test.ts \
            scripts/recipe-proxy-config.test.ts \
            scripts/recipe-vite-proxy.test.ts
          do
            timeout --signal=TERM --kill-after=5s 90s \
              bun test --timeout=15000 "$test_file" || status=1
          done
          exit "$status"
      - name: Verify real HTTP CONNECT and SOCKS transfers
        if: ${{ !cancelled() && steps.upstream-dependencies.outcome == 'success' }}
        run: >-
          timeout --signal=TERM --kill-after=5s 180s
          bun test --timeout=15000 packages/registry/src/services/spack-upstream-download.test.ts
