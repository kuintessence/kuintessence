{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "kq.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required (>= 32 chars)" .Values.secrets.jwtSecret | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required when postgres.enabled=true" .Values.postgres.password | quote }}
  {{- end }}
  {{- if .Values.rustfs.enabled }}
  RUSTFS_SECRET_KEY: {{ required "rustfs.rootPassword is required when rustfs.enabled=true" .Values.rustfs.rootPassword | quote }}
  {{- end }}
  {{- if .Values.netdrive.enabled }}
  {{- if .Values.rustfs.enabled }}
  NETDRIVE_ACCESS_KEY: {{ required "netdrive.accessKey must name an ordinary IAM user when rustfs.enabled=true" .Values.netdrive.accessKey | quote }}
  NETDRIVE_SECRET_KEY: {{ required "netdrive.secretKey is required when netdrive.enabled=true" .Values.netdrive.secretKey | quote }}
  {{- else }}
  NETDRIVE_ACCESS_KEY: {{ required "netdrive.accessKey is required when netdrive.enabled=true and rustfs.enabled=false" .Values.netdrive.accessKey | quote }}
  NETDRIVE_SECRET_KEY: {{ required "netdrive.secretKey is required when netdrive.enabled=true and rustfs.enabled=false" .Values.netdrive.secretKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
