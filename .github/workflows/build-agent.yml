name: Build Agent binary

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "将构建产物上传到当前 v* tag 的 GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build agent (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [bun-linux-x64, bun-linux-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protobuf stubs
        run: bun run --filter @kuintessence/proto generate

      - name: Build agent binary
        run: |
          mkdir -p dist
          bun build \
            --compile \
            --target=${{ matrix.target }} \
            packages/agent/src/index.ts \
            --outfile=dist/kq-agent-${{ matrix.target }}
          ls -lh dist/

      - name: Smoke Linux x64 binary
        if: matrix.target == 'bun-linux-x64'
        run: |
          set +e
          output="$(env -i HOME="$RUNNER_TEMP" PATH="/usr/bin:/bin" dist/kq-agent-bun-linux-x64 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fq "Invalid Agent configuration:" <<<"$output"

      - name: Package and verify artifacts
        run: |
          binary="kq-agent-${{ matrix.target }}"
          zstd -q -19 -f "dist/$binary" -o "dist/$binary.zst"
          zstd --test "dist/$binary.zst"
          (
            cd dist
            sha256sum "$binary" "$binary.zst" > "SHA256SUMS-${{ matrix.target }}"
            sha256sum --check --strict "SHA256SUMS-${{ matrix.target }}"
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kq-agent-${{ matrix.target }}
          path: |
            dist/kq-agent-${{ matrix.target }}
            dist/kq-agent-${{ matrix.target }}.zst
            dist/SHA256SUMS-${{ matrix.target }}
          retention-days: 14

  release:
    name: Attach binaries to GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: inputs.publish_release && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Assemble and verify release manifest
        run: |
          cat \
            dist/SHA256SUMS-bun-linux-x64 \
            dist/SHA256SUMS-bun-linux-arm64 \
            > dist/SHA256SUMS
          (
            cd dist
            sha256sum --check --strict SHA256SUMS
          )

      - name: List artifacts
        run: ls -lh dist/

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kq-agent-bun-linux-x64
            dist/kq-agent-bun-linux-x64.zst
            dist/kq-agent-bun-linux-arm64
            dist/kq-agent-bun-linux-arm64.zst
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
