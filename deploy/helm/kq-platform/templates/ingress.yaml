{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels: {{- include "kq.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.preview.enabled }}
  rules:
    - host: {{ .Values.preview.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  number: {{ .Values.preview.gatewayPort }}
  # Traefik's already configured default certificate handles TLS termination.
  # Kubernetes Secrets are namespace-scoped; never reference kube-system here.
  tls:
    - hosts:
        - {{ .Values.preview.host | quote }}
  {{- else }}
  {{- $ports := dict "server" .Values.server.port "registry" .Values.registry.port "web" .Values.web.port "rustfs" 9000 }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Release.Name }}-{{ .service }}
                port:
                  number: {{ get $ports .service | required "unsupported ingress backend service" }}
          {{- end }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
