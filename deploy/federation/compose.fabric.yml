      CHAINCODE_TLS_CLIENT_CA_FILE: /run/kq-chaincode/client-ca.crt
    volumes:
    - type: bind
      source: ${KQ_FABRIC_DIRECTORY:?set absolute deployment-owned Fabric directory}/chaincodes/commercial
      target: /run/kq-chaincode
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - const s=require('node:net').connect(9999,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
  fabric-market-adapter:
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    image: ghcr.io/${KQ_IMAGE_OWNER:-kuintessence}/kuintessence-fabric-adapter:${KQ_IMAGE_TAG:-main}
    environment:
      KQ_FABRIC_ADAPTER_KIND: market
      KQ_FABRIC_ADAPTER_CONFIG: /run/kq-fabric-config/adapter.json
    volumes:
    - type: bind
      source: ${KQ_FABRIC_DIRECTORY:?set absolute deployment-owned Fabric directory}/adapters/market
