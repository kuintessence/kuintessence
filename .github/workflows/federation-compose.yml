name: Federation Compose delivery

on:
  workflow_dispatch:
    inputs:
      build_offline_bundle:
        description: "串行构建完整 AIO 镜像并上传离线交付包（不部署）"
        type: boolean
        default: false
      spack_version:
        description: "AIO 调度器的精确 Spack 版本"
        type: choice
        options: ["1.0.3", "1.0.0"]
        default: "1.0.3"
  pull_request:
    paths:
      - .github/workflows/federation-compose.yml
      - .github/workflows/build-images.yml
      - .github/workflows/deploy-federation.yml
      - deploy/federation/**
      - deploy/main/compose.yml
      - packages/fabric-adapter/**
      - packages/cli/src/agent-registration-entry.ts
      - packages/cli/src/commands/agent*
      - deploy/schedulers/**
      - packages/shared/**
      - contracts/fabric/**
      - packages/*/package.json
      - package.json
      - bun.lock
      - .dockerignore
      - scripts/federation-compose-*.py
      - scripts/federation-offline-test.py
      - scripts/federation-managed-runtime-test.py

permissions:
  contents: read

concurrency:
  group: federation-compose-${{ github.event.pull_request.number || github.ref }}-${{ inputs.build_offline_bundle || false }}
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate both Compose variants
        run: |
          bash -n deploy/federation/{compose,remote,apply,fabric-init}.sh
          python3 scripts/federation-compose-check.py
          python3 scripts/federation-compose-remote-check.py
          bash -n deploy/federation/aio/register-agent.sh
          bash -n deploy/schedulers/{slurm,pbs}/entrypoint.sh
          python3 scripts/federation-offline-test.py
          python3 scripts/federation-managed-runtime-test.py
  images:
    if: inputs.build_offline_bundle != true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: federation-gateway
            dockerfile: deploy/federation/gateway.Dockerfile
          - component: fabric-adapter
            dockerfile: deploy/federation/runtime.Dockerfile
            target: adapter
          - component: fabric-chaincode
            dockerfile: deploy/federation/runtime.Dockerfile
            target: chaincode
          - component: fabric-tools
            dockerfile: deploy/federation/tools.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64
          load: true
          push: false
          tags: kuintessence-${{ matrix.component }}:compose-ci
          cache-from: type=gha,scope=compose-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=compose-${{ matrix.component }}
      - name: Start the real image entrypoints with isolated test identities
        run: python3 scripts/federation-compose-smoke.py '${{ matrix.component }}' 'kuintessence-${{ matrix.component }}:compose-ci'

  offline-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.build_offline_bundle == true
    needs: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DOCKER_BUILDKIT: "1"
      SPACK_VERSION: ${{ inputs.spack_version }}
      CASDOOR_IMAGE: casbin/casdoor@sha256:7e8ab89f046b24960a2a6ccab338935d787f21c55690114478dd3cae604631cf
      BUNDLE: ${{ runner.temp }}/federation-aio-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Only reclaim unused SDKs on this disposable GitHub-hosted runner.
      - name: Make room for image builds and the conservative export margin
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Build all AIO images sequentially
        run: >-
          python3 deploy/federation/offline.py build
          --revision "$GITHUB_SHA" --casdoor-image "$CASDOOR_IMAGE"
          --spack-version "$SPACK_VERSION"
      - name: Export and verify the complete offline bundle
        run: |
          python3 deploy/federation/offline.py export \
            --revision "$GITHUB_SHA" --casdoor-image "$CASDOOR_IMAGE" --output "$BUNDLE"
          manifest_sha="$(sha256sum "$BUNDLE/manifest.json" | cut -d ' ' -f 1)"
          python3 deploy/federation/offline.py verify --bundle "$BUNDLE" --manifest-sha256 "$manifest_sha"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Spack: $SPACK_VERSION"
            echo "Manifest SHA-256: $manifest_sha"
            echo "21 linux/amd64 images; no deployment, institution keys or scientific software materials."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: federation-aio-${{ github.sha }}-spack-${{ inputs.spack_version }}
          path: ${{ env.BUNDLE }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
