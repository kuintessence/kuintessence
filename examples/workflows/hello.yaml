# Single-node control-flow workflow (WorkflowSchema). One
# SoftwareUsecaseComputing node binds its `script` Text slot to a constant CEL
# string literal. Execution requires the referenced usecase and software.
name: hello
description: Single-node usecase compute that writes and extracts a value.
parameters: []
spec:
  nodeDrafts:
    - type: SoftwareUsecaseComputing
      id: hello
      name: hello
      usecaseVersionId: "3f2504e0-4f89-41d3-9a0c-0305e82c3301"
      softwareVersionId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      inputSlots:
        - type: Text
          descriptor: script
          from:
            expr: "'echo 42 > result.txt; echo sum=99'"
  nodeRelations: []
