name: Build production images

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

# Serialize publications so concurrent releases cannot race to update latest.
concurrency:
  group: production-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            dockerfile: packages/server/Dockerfile
          - component: registry
            dockerfile: packages/registry/Dockerfile
          - component: web
            dockerfile: packages/web/Dockerfile
          - component: db-migrate
            dockerfile: packages/db/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve production image tags
        id: image
        uses: actions/github-script@v7
        env:
          COMPONENT: ${{ matrix.component }}
        with:
          script: |
            const repository = `ghcr.io/${context.repo.owner.toLowerCase()}/kuintessence-${process.env.COMPONENT}`;
            let tags;
            if (context.eventName === "push" && context.ref === "refs/heads/main") {
              tags = ["main"];
            } else if (context.eventName === "release" && context.payload.action === "published") {
              const release = context.payload.release;
              const tag = release.tag_name;
              if (release.draft || !/^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$/.test(tag) ||
                  tag === "main" || tag === "latest") {
                throw new Error("Release tag must be a valid container tag other than main/latest");
              }
              tags = release.prerelease ? [tag] : [tag, "latest"];
            } else {
              throw new Error("Production images require a main push or published release");
            }
            core.setOutput("tags", tags.map((tag) => `${repository}:${tag}`).join("\n"));

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_PREVIEW_LOGIN=false
          cache-from: type=gha,scope=production-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.component }}

  deploy-main:
    name: Deploy main via SSH
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Upload Compose configuration and deploy
        env:
          MAIN_SSH_HOST: ${{ secrets.MAIN_SSH_HOST }}
          MAIN_SSH_PORT: ${{ secrets.MAIN_SSH_PORT }}
          MAIN_SSH_USER: ${{ secrets.MAIN_SSH_USER }}
          MAIN_SSH_KEY: ${{ secrets.MAIN_SSH_KEY }}
        run: bash deploy/main/remote.sh
