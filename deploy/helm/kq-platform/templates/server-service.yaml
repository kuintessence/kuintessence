apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  labels: {{- include "kq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kq.workloadSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
    - name: grpc
      port: {{ .Values.server.grpcPort }}
      targetPort: grpc
{{- if .Values.server.relay.domain }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server-peers
spec:
  clusterIP: None
  selector:
    {{- include "kq.workloadSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
{{- range $i := until (int (include "kq.serverRelaySlots" .)) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-server-{{ $i }}
spec:
  selector:
    statefulset.kubernetes.io/pod-name: {{ $.Release.Name }}-server-{{ $i }}
  ports:
    - name: http
      port: {{ $.Values.server.port }}
      targetPort: http
{{- end }}
{{- end }}
