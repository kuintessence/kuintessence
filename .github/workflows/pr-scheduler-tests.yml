name: PR scheduler tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-scheduler-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduler:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scheduler: [slurm, pbs]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and test disposable scheduler stack
        env:
          SCHEDULER: ${{ matrix.scheduler }}
        run: timeout --signal=TERM --kill-after=60s 40m bash deploy/pr-test/run.sh "$SCHEDULER"
